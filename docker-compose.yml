services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campaign_ops
      POSTGRES_USER: campaign_ops
      POSTGRES_PASSWORD: campaign_ops_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign_ops -d campaign_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://campaign_ops:campaign_ops_dev_only@db:5432/campaign_ops
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

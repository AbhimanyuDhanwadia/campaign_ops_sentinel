[project]
name = "campaign-ops-sentinel"
version = "0.1.0"
description = "A safety-first, shadow-mode agentic workflow for gaming advertising operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
